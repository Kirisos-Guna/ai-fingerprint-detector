name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run selftest (pre-build sanity)
        shell: pwsh
        run: python gui_app.py --selftest

      - name: Build exe
        run: python build_exe.py

      - name: Verify built exe selftest
        shell: pwsh
        run: |
          $out = & .\dist\AIFingerprintDetector.exe --selftest 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "exe selftest failed" }
          if (-not ($out -match 'PASS')) { throw "selftest did not print PASS" }

      - name: Zip dist folder
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/','' } else { 'dev-' + $env:GITHUB_SHA.Substring(0,7) }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Compress-Archive -Path dist\AIFingerprintDetector.exe, dist\chromium -DestinationPath "AIFingerprintDetector-$tag-win64.zip"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: AIFingerprintDetector-${{ env.RELEASE_TAG }}-win64
          path: AIFingerprintDetector-${{ env.RELEASE_TAG }}-win64.zip

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AIFingerprintDetector-*.zip
          generate_release_notes: true
